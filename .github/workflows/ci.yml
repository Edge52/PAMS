# Checks on every push and pull request (wave 20): types, lint, unit tests, then every page of the demo.
name: Checks
on:
  push:
  pull_request:

jobs:
  code:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx eslint src scripts
      - run: npx vitest run

  pages:
    name: Every page of the demo
    runs-on: ubuntu-latest
    needs: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the demo
        run: |
          npm run demo > demo.log 2>&1 &
          for i in $(seq 1 180); do curl -sf -o /dev/null http://localhost:3000/login && exit 0; sleep 5; done
          cat demo.log; exit 1
      - run: npm run check:pages
      - if: failure()
        run: tail -50 demo.log
