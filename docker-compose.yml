# Hospital PAMS on one server: app + PostgreSQL + daily backups + automatic HTTPS (Caddy).
#   cp .env.example .env    # set DOMAIN, POSTGRES_PASSWORD, APP_URL (and SMTP for email)
#   docker compose up -d --build
# See docs/deploy.md.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hpams
      POSTGRES_USER: hpams
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hpams -d hpams"]
      interval: 10s
      retries: 10

  app:
    build:
      context: .
      # used at build time. PG_CLIENT_MAJOR must match the database server's major version (the db service below is 16),
      # so files from Back up now restore with that server's pg_restore. Supabase on PostgreSQL 17: set it to 17.
      args: { APP_TIME_ZONE: "${APP_TIME_ZONE:-Africa/Cairo}", PG_CLIENT_MAJOR: "${PG_CLIENT_MAJOR:-16}" }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://hpams:${POSTGRES_PASSWORD}@db:5432/hpams
      APP_URL: ${APP_URL:-https://${DOMAIN}}
      COOKIE_SECURE: "1"
      TRUST_PROXY: "1"            # Caddy sets X-Forwarded-For
      SETUP_CODE: ${SETUP_CODE:?set SETUP_CODE in .env (asked for when creating the first administrator)}
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups   # the same folder the nightly job writes to: Administration › Backups lists both
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes: [uploads:/data/uploads, ./backups:/data/backups]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN:?set DOMAIN in .env}" }
    command: caddy reverse-proxy --from ${DOMAIN} --to app:3000
    volumes: [caddy-data:/data, caddy-config:/config]

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGHOST: db
      PGUSER: hpams
      PGDATABASE: hpams
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes: [./backups:/backups, uploads:/uploads:ro, ./scripts/nightly-backup.sh:/nightly-backup.sh:ro]
    # Every 24 h: a verified database dump + uploads archive. Old backups are removed only after a good run, and the
    # result is written to backups/.nightly-status (shown on Administration › Backups; failures alert administrators).
    entrypoint: ["sh", "/nightly-backup.sh"]

volumes: { db-data: {}, uploads: {}, caddy-data: {}, caddy-config: {} }
