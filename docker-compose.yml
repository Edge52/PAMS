# Hospital PAMS on one server: app + PostgreSQL + daily backups + automatic HTTPS (Caddy).
#   cp .env.example .env    # set DOMAIN, POSTGRES_PASSWORD, APP_URL (and SMTP for email)
#   docker compose up -d --build
# See docs/deploy.md.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hpams
      POSTGRES_USER: hpams
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hpams -d hpams"]
      interval: 10s
      retries: 10

  app:
    build:
      context: .
      args: { APP_TIME_ZONE: "${APP_TIME_ZONE:-Africa/Cairo}" }   # used at build time
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://hpams:${POSTGRES_PASSWORD}@db:5432/hpams
      APP_URL: ${APP_URL:-https://${DOMAIN}}
      COOKIE_SECURE: "1"
      TRUST_PROXY: "1"            # Caddy sets X-Forwarded-For
      SETUP_CODE: ${SETUP_CODE:?set SETUP_CODE in .env (asked for when creating the first administrator)}
      UPLOAD_DIR: /data/uploads
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes: [uploads:/data/uploads]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN:?set DOMAIN in .env}" }
    command: caddy reverse-proxy --from ${DOMAIN} --to app:3000
    volumes: [caddy-data:/data, caddy-config:/config]

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes: [./backups:/backups, uploads:/uploads:ro]
    # Every 24 h: database dump + uploads archive, oldest removed after KEEP_DAYS.
    entrypoint: ["sh", "-c", "while true; do t=$$(date +%Y%m%d-%H%M); pg_dump -h db -U hpams -d hpams -Fc -f /backups/hpams-$$t.dump && tar -czf /backups/uploads-$$t.tar.gz -C /uploads . && echo backup $$t done; find /backups -type f -mtime +$$KEEP_DAYS -delete; sleep 86400; done"]

volumes: { db-data: {}, uploads: {}, caddy-data: {}, caddy-config: {} }
