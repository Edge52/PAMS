# Hospital PAMS on one server: app + PostgreSQL + daily backups + automatic HTTPS (Caddy).
#   cp .env.example .env    # set DOMAIN, POSTGRES_PASSWORD, APP_URL (and SMTP for email)
#   docker compose up -d --build
# See docs/deploy.md.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hpams
      POSTGRES_USER: hpams
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hpams -d hpams"]
      interval: 10s
      retries: 10

  app:
    build:
      context: .
      # used at build time. PG_CLIENT_MAJOR must match the database server's major version (the db service below is 16),
      # so files from Back up now restore with that server's pg_restore. Supabase on PostgreSQL 17: set it to 17.
      args: { APP_TIME_ZONE: "${APP_TIME_ZONE:-Africa/Cairo}", PG_CLIENT_MAJOR: "${PG_CLIENT_MAJOR:-16}" }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://hpams:${POSTGRES_PASSWORD}@db:5432/hpams
      APP_URL: ${APP_URL:-https://${DOMAIN}}
      COOKIE_SECURE: "1"
      TRUST_PROXY: "1"            # Caddy sets X-Forwarded-For
      SETUP_CODE: ${SETUP_CODE:?set SETUP_CODE in .env (asked for when creating the first administrator)}
      APP_SECRET: ${APP_SECRET:-}   # 32+ characters: encrypts two-step secrets (keep it safe and never change it)
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups   # the same folder the nightly job writes to: Administration › Backups lists both
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Optional settings from .env (all listed in .env.example; empty = off or the built-in default). CO-05.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}        # the assistant (then switch it on in Administration › Settings)
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}                  # Microsoft / Google sign-in
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_PROVIDERS: ${SUPABASE_PROVIDERS:-azure,google}
      SUPABASE_AZURE_TENANTS: ${SUPABASE_AZURE_TENANTS:-}
      DATABASE_SSL: ${DATABASE_SSL:-}                  # only for a hosted database instead of the db service
      DATABASE_SSL_CA: ${DATABASE_SSL_CA:-}            # a path inside the container: mount the file too
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-}
      ALERTS_DISABLED: ${ALERTS_DISABLED:-}            # 1 on a second app instance
      MIGRATE_BACKUP: ${MIGRATE_BACKUP:-}              # 0 = migrate on start without a pg_dump copy first
      PG_DUMP_PATH: ${PG_DUMP_PATH:-}
      PG_RESTORE_PATH: ${PG_RESTORE_PATH:-}
    volumes: [uploads:/data/uploads, ./backups:/data/backups]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN:?set DOMAIN in .env}" }
    command: caddy reverse-proxy --from ${DOMAIN} --to app:3000
    volumes: [caddy-data:/data, caddy-config:/config]

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGHOST: db
      PGUSER: hpams
      PGDATABASE: hpams
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      APP_UID: ${APP_UID:-1000}   # backups are written 0600 and handed to the app's user (S13)
    volumes: [./backups:/backups, uploads:/uploads:ro, ./scripts/nightly-backup.sh:/nightly-backup.sh:ro]
    # Every 24 h: a verified database dump + uploads archive. Old backups are removed only after a good run, and the
    # result is written to backups/.nightly-status (shown on Administration › Backups; failures alert administrators).
    entrypoint: ["sh", "/nightly-backup.sh"]

volumes: { db-data: {}, uploads: {}, caddy-data: {}, caddy-config: {} }
